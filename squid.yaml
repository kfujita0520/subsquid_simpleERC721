manifestVersion: subsquid.io/v0.1
name: stm-indexer-astar-v3
version: 1
description: 'ERC721 indexer for Astar network'
build: 
deploy:
  addons:
    postgres: 
  processor:
    cmd:
      - sqd
      - process:prod
    env:
      RPC_ENDPOINT: ${{ secrets.ASTAR_RPC_ENDPOINT }}
  api:
    cmd:
      - sqd
      - serve:prod
scale:
  dedicated: false
  processor:
    profile: medium
  addons:
    postgres:
      profile: small